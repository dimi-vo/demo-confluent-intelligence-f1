name: Pages

# Publishes docs/site/pre-provisioned.html as the root page of the GitHub Pages site,
# with its screenshots from docs/site/assets/.
on:
  push:
    branches: [master]
    paths:
      - docs/site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          mkdir _site
          cp docs/site/pre-provisioned.html _site/index.html
          cp -r docs/site/assets _site/assets

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
